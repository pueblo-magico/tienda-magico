name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      existing_tag:
        description: Existing image tag on the VM to activate (leave blank to build this commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tienda-magico-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    env:
      SHOP_URL: ${{ vars.SHOP_URL }}
      CMS_URL: ${{ vars.CMS_URL }}
      DEPLOY_PLATFORM: ${{ vars.DEPLOY_PLATFORM }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      CHECKOUT_PROVIDER: ${{ vars.CHECKOUT_PROVIDER }}
      MERCADOPAGO_SANDBOX: ${{ vars.MERCADOPAGO_SANDBOX }}
      MERCADOPAGO_WEBHOOK_URL: ${{ vars.MERCADOPAGO_WEBHOOK_URL }}
      REQUESTED_TAG: ${{ inputs.existing_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          required=(
            SHOP_URL CMS_URL DEPLOY_PLATFORM SSH_HOST SSH_USER
            CHECKOUT_PROVIDER MERCADOPAGO_SANDBOX MERCADOPAGO_WEBHOOK_URL
          )
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || {
              echo "Missing staging GitHub Environment variable: ${key}"
              exit 1
            }
          done

          [[ "$SHOP_URL" =~ ^https?://[^/]+$ ]] || {
            echo "SHOP_URL must be an HTTP(S) origin without a trailing slash."
            exit 1
          }
          [[ "$CMS_URL" =~ ^https?://[^/]+$ ]] || {
            echo "CMS_URL must be an HTTP(S) origin without a trailing slash."
            exit 1
          }
          [[ "$DEPLOY_PLATFORM" == "linux/amd64" || "$DEPLOY_PLATFORM" == "linux/arm64" ]] || {
            echo "DEPLOY_PLATFORM must be linux/amd64 or linux/arm64."
            exit 1
          }
          [[ "$CHECKOUT_PROVIDER" == "mercado-pago" ]] || {
            echo "CHECKOUT_PROVIDER must be mercado-pago for staging."
            exit 1
          }
          [[ "$MERCADOPAGO_SANDBOX" == "true" ]] || {
            echo "MERCADOPAGO_SANDBOX must be true for staging."
            exit 1
          }
          [[ -n "$MERCADOPAGO_ACCESS_TOKEN" ]] || {
            echo "Missing staging GitHub Environment secret: MERCADOPAGO_ACCESS_TOKEN"
            exit 1
          }
          [[ "$MERCADOPAGO_WEBHOOK_URL" == "$SHOP_URL/api/checkout/webhooks/mercado-pago" ]] || {
            echo "MERCADOPAGO_WEBHOOK_URL must use SHOP_URL and the Mercado Pago webhook path."
            exit 1
          }

          runtime_values=(
            "$CHECKOUT_PROVIDER" "$MERCADOPAGO_SANDBOX"
            "$MERCADOPAGO_WEBHOOK_URL" "$MERCADOPAGO_ACCESS_TOKEN"
          )
          for value in "${runtime_values[@]}"; do
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
              echo "Managed runtime values must not contain line breaks."
              exit 1
            }
          done

          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            IMAGE_TAG="$REQUESTED_TAG"
            BUILD_RELEASE=false
          else
            IMAGE_TAG="staging-${GITHUB_SHA:0:12}"
            BUILD_RELEASE=true
          fi
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "The release tag contains unsupported characters."
            exit 1
          }

          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "BUILD_RELEASE=$BUILD_RELEASE" >> "$GITHUB_ENV"
          echo "ARTIFACT=artifacts/manual/tienda-magico-${IMAGE_TAG}.tar" >> "$GITHUB_ENV"
          echo "Release tag: $IMAGE_TAG"

      - name: Prepare managed storefront runtime configuration
        shell: bash
        env:
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          runtime_file="$RUNNER_TEMP/storefront-runtime.env"
          umask 077
          {
            printf 'CHECKOUT_PROVIDER=%s\n' "$CHECKOUT_PROVIDER"
            printf 'MERCADOPAGO_ACCESS_TOKEN=%s\n' "$MERCADOPAGO_ACCESS_TOKEN"
            printf 'MERCADOPAGO_SANDBOX=%s\n' "$MERCADOPAGO_SANDBOX"
            printf 'MERCADOPAGO_WEBHOOK_URL=%s\n' "$MERCADOPAGO_WEBHOOK_URL"
          } > "$runtime_file"
          echo "RUNTIME_ENV_FILE=$runtime_file" >> "$GITHUB_ENV"

      - name: Configure SSH host verification
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "Missing staging secret: SSH_PRIVATE_KEY"; exit 1; }
          [[ -n "$SSH_KNOWN_HOSTS" ]] || { echo "Missing staging secret: SSH_KNOWN_HOSTS"; exit 1; }

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare Docker Buildx
        if: env.BUILD_RELEASE == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build immutable deployment artifact
        if: env.BUILD_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build-artifact -- \
            --tag "$IMAGE_TAG" \
            --shop-url "$SHOP_URL" \
            --cms-url "$CMS_URL" \
            --platform "$DEPLOY_PLATFORM"

      - name: Verify artifact checksum
        if: env.BUILD_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$ARTIFACT")"
          sha256sum --check "$(basename "$ARTIFACT").sha256"

      - name: Copy release and deployment kit to VM
        shell: bash
        run: |
          set -euo pipefail
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          REMOTE_BUNDLE="/tmp/tienda-manual-${IMAGE_TAG}"
          REMOTE_RUNTIME_ENV="/tmp/tienda-storefront-runtime-${IMAGE_TAG}.env"

          scp -P "$SSH_PORT" -r deploy/manual "${SSH_TARGET}:${REMOTE_BUNDLE}"
          ssh -p "$SSH_PORT" "$SSH_TARGET" \
            "umask 077; cat > '$REMOTE_RUNTIME_ENV'" < "$RUNTIME_ENV_FILE"
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            scp -P "$SSH_PORT" \
              "$ARTIFACT" \
              "${ARTIFACT}.sha256" \
              "${SSH_TARGET}:/tmp/"
          fi

      - name: Activate and verify release
        shell: bash
        run: |
          set -euo pipefail
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          REMOTE_BUNDLE="/tmp/tienda-manual-${IMAGE_TAG}"
          REMOTE_ARTIFACT="/tmp/tienda-magico-${IMAGE_TAG}.tar"
          REMOTE_RUNTIME_ENV="/tmp/tienda-storefront-runtime-${IMAGE_TAG}.env"

          ssh -p "$SSH_PORT" "$SSH_TARGET" bash -s -- \
            "$IMAGE_TAG" "$BUILD_RELEASE" "$REMOTE_BUNDLE" "$REMOTE_ARTIFACT" \
            "$REMOTE_RUNTIME_ENV" <<'REMOTE'
          set -euo pipefail
          image_tag="$1"
          build_release="$2"
          bundle="$3"
          artifact="$4"
          runtime_env="$5"
          app_dir="/opt/tienda-magico"
          storefront_env="$app_dir/env/storefront.env"
          deployment_env="$app_dir/deployment.env"
          storefront_backup="/tmp/tienda-storefront-${image_tag}.backup"
          deployment_backup="/tmp/tienda-deployment-${image_tag}.backup"

          sudo bash "$bundle/vm-deploy.sh" install
          sudo cp -p "$storefront_env" "$storefront_backup"
          sudo cp -p "$deployment_env" "$deployment_backup"

          restore_previous_release() {
            status=$?
            trap - ERR
            set +e
            echo "Activation failed; restoring the previous runtime configuration and release tag."
            sudo cp -p "$storefront_backup" "$storefront_env"
            sudo cp -p "$deployment_backup" "$deployment_env"
            sudo docker compose \
              --env-file "$deployment_env" \
              -f "$app_dir/compose.yml" \
              up -d --remove-orphans --wait --wait-timeout 180
            sudo rm -f -- "$storefront_backup" "$deployment_backup"
            rm -rf -- "$bundle" "$runtime_env"
            exit "$status"
          }
          trap restore_previous_release ERR

          sudo bash "$bundle/update-runtime-env.sh" "$runtime_env" "$storefront_env"

          if [[ "$build_release" == "true" ]]; then
            cd /tmp
            sha256sum --check "$(basename "$artifact").sha256"
            sudo bash "$bundle/vm-deploy.sh" activate \
              --artifact "$artifact" \
              --tag "$image_tag"
          else
            sudo bash "$bundle/vm-deploy.sh" activate --tag "$image_tag"
          fi

          sudo bash "$bundle/vm-deploy.sh" status
          trap - ERR
          sudo rm -f -- "$storefront_backup" "$deployment_backup"
          rm -rf -- "$bundle" "$runtime_env"
          REMOTE

      - name: Verify public staging endpoints
        shell: bash
        run: |
          set -euo pipefail

          check_endpoint() {
            local name="$1"
            local url="$2"

            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --output /dev/null "$url"; then
                echo "$name is reachable at $url"
                return 0
              fi

              echo "$name is not ready yet (attempt $attempt/12)."
              sleep 10
            done

            echo "$name public smoke check failed: $url"
            return 1
          }

          check_endpoint "Storefront" "$SHOP_URL/"
          check_endpoint "CMS" "$CMS_URL/admin"

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Staging deployment"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image tag: \`${IMAGE_TAG:-not-created}\`"
            echo "- Storefront: $SHOP_URL"
            echo "- CMS: $CMS_URL/admin"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove transferred release files
        if: success() && env.BUILD_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          ssh -p "$SSH_PORT" "$SSH_TARGET" \
            "rm -f '/tmp/tienda-magico-${IMAGE_TAG}.tar' '/tmp/tienda-magico-${IMAGE_TAG}.tar.sha256'"
