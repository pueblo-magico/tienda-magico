name: Build and deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      target:
        description: GitHub Environment to deploy
        required: true
        type: choice
        default: staging
        options: [staging, production]
      image_tag:
        description: Existing image tag to activate (use for rollback; leave blank to build this commit)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Production deployments are manual and must originate from main.
    if: >-
      github.event_name == 'push' ||
      (inputs.target == 'staging') ||
      (inputs.target == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    concurrency:
      group: tienda-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      STOREFRONT_HOST: ${{ vars.STOREFRONT_HOST }}
      CMS_HOST: ${{ vars.CMS_HOST }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      PAYLOAD_ECOMMERCE_URL: ${{ vars.PAYLOAD_ECOMMERCE_URL }}
      PAYLOAD_CMS_URL: ${{ vars.PAYLOAD_CMS_URL }}
      CMS_MEDIA_ORIGIN: ${{ vars.CMS_MEDIA_ORIGIN }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      STOREFRONT_ENV: ${{ secrets.STOREFRONT_ENV }}
      CMS_ENV: ${{ secrets.CMS_ENV }}
      POSTGRES_ENV: ${{ secrets.POSTGRES_ENV }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          required=(GCP_PROJECT_ID GCP_REGION GCP_ZONE GCP_INSTANCE ARTIFACT_REPOSITORY GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT STOREFRONT_HOST CMS_HOST NEXT_PUBLIC_SITE_URL PAYLOAD_ECOMMERCE_URL PAYLOAD_CMS_URL)
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || { echo "Missing GitHub Environment variable: $key"; exit 1; }
          done
          for key in STOREFRONT_ENV CMS_ENV POSTGRES_ENV; do
            [[ -n "${!key:-}" ]] || { echo "Missing GitHub Environment secret: $key"; exit 1; }
          done

      - uses: google-github-actions/auth@v3.0.0  # SHA v3.0.0 (2025-08-07)
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3.0.0  # SHA v3.0.0 (2025-08-07)

      - name: Build and publish immutable images
        if: github.event_name == 'push' || inputs.image_tag == ''
        run: |
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f deploy/docker/storefront.Dockerfile \
            --build-arg NEXT_PUBLIC_SITE_URL \
            --build-arg PAYLOAD_ECOMMERCE_URL \
            --build-arg PAYLOAD_CMS_URL \
            --build-arg CMS_MEDIA_ORIGIN \
            -t "${REGISTRY}/storefront:${IMAGE_TAG}" .
          docker build -f apps/cms/Dockerfile \
            -t "${REGISTRY}/cms:${IMAGE_TAG}" apps/cms
          docker push "${REGISTRY}/storefront:${IMAGE_TAG}"
          docker push "${REGISTRY}/cms:${IMAGE_TAG}"

      - name: Provision deployment assets and runtime configuration
        run: |
          remote() {
            gcloud compute ssh "$GCP_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --command "$1"
          }
          BUNDLE="/tmp/tienda-gce-${IMAGE_TAG}"
          gcloud compute scp --recurse deploy/gce "$GCP_INSTANCE:${BUNDLE}" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap
          remote "if ! command -v docker >/dev/null; then sudo bash ${BUNDLE}/gce/deploy.sh bootstrap; fi"
          remote "sudo bash ${BUNDLE}/gce/deploy.sh configure --shop-host '${STOREFRONT_HOST}' --cms-host '${CMS_HOST}' --storefront-image '${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/storefront' --cms-image '${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/cms'"
          for file in storefront cms postgres; do
            secret_name="$(tr '[:lower:]' '[:upper:]' <<< "${file}")_ENV"
            encoded="$(printf %s "${!secret_name}" | base64 --wrap=0)"
            remote "printf %s '${encoded}' | base64 --decode | sudo tee /etc/tienda-magico/${file}.env >/dev/null && sudo chmod 600 /etc/tienda-magico/${file}.env"
          done
          remote "sudo bash ${BUNDLE}/gce/deploy.sh activate --tag '${IMAGE_TAG}'"
          remote "rm -rf '${BUNDLE}'"
