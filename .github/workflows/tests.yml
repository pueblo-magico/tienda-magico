name: Pruebas

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  storefront:
    name: Storefront
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar la suite migrada
        run: npm run test:ci

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas-storefront
          if-no-files-found: warn
          path: |
            coverage/vitest
            .vitest
            playwright-report
            test-results
