name: Pruebas

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  storefront:
    name: Storefront
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Vitest
        id: vitest
        continue-on-error: true
        run: npm run test:ci:unit

      - name: Ejecutar Playwright
        id: playwright
        if: always()
        continue-on-error: true
        run: npm run test:ci:e2e

      - name: Publicar resumen de resultados
        if: always()
        env:
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: node scripts/ci-test-summary.mjs

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-pruebas-storefront
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            coverage/vitest
            .vitest
            playwright-report
            test-results

      - name: Validar resultado de pruebas
        if: always()
        env:
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          if [ "$VITEST_OUTCOME" != "success" ] || [ "$PLAYWRIGHT_OUTCOME" != "success" ]; then
            echo "Una o más suites de pruebas fallaron." >&2
            exit 1
          fi
