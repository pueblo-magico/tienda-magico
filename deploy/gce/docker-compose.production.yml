services:
  storefront:
    image: ${STOREFRONT_IMAGE:?Set STOREFRONT_IMAGE}:${TIENDA_IMAGE_TAG:?Set TIENDA_IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - /etc/tienda-magico/storefront.env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  cms:
    image: ${CMS_IMAGE:?Set CMS_IMAGE}:${TIENDA_IMAGE_TAG:?Set TIENDA_IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - /etc/tienda-magico/cms.env
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - /var/lib/tienda-magico/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/admin || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - /etc/tienda-magico/postgres.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /var/lib/tienda-magico/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-tienda_magico_cms}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
