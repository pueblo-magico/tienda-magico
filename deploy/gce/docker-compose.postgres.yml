# Production Postgres for same-VM deploys.
# Binds only to loopback — do not publish 5433 on a public interface.
#
# Usage (prefer deploy.sh so env files stay consistent):
#   sudo ./deploy/gce/deploy.sh db-up
#
# Manual:
#   docker compose --env-file /etc/tienda-magico/postgres.env \
#     -f deploy/gce/docker-compose.postgres.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tienda_magico_cms}
    volumes:
      - tm_cms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tienda_magico_cms}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tm_cms_pgdata:
