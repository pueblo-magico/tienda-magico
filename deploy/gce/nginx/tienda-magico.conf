# Legacy combined same-VM site (shop + cms).
# deploy.sh prefers the split templates:
#   nginx/storefront.conf → tienda-magico-web.conf
#   nginx/cms.conf        → tienda-magico-cms.conf
# Kept as a fallback reference for --role all.
#
# Replace shop.example.com / cms.example.com (or set via deploy.sh sed).
# TLS: use certbot after DNS points at the VM, or terminate TLS at a GCP HTTPS LB.

upstream tm_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream tm_cms {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Storefront
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    client_max_body_size 12m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://tm_web;
    }
}

# ---------------------------------------------------------------------------
# CMS admin + API + media
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cms.example.com;

    # Media / large Lexical payloads
    client_max_body_size 32m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://tm_cms;
    }
}
